title: APT29 PowerShell Execution
id: a1b2c3d4-0001-4e5f-8a9b-apt29t1059001
status: test
description: Detects PowerShell execution used by APT29 for payload delivery and reconnaissance. Based on real lab emulation evidence.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/groups/G0016/
    - https://uncoder.io/
author: TheCyberDefenseGuy
date: 2026-05-13
modified: 2026-05-13
tags:
    - attack.execution
    - attack.t1059.001
    - apt29
    - cozy_bear
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'powershell'
            - 'powershell.exe'
    condition: selection
falsepositives:
    - Legitimate administrative PowerShell usage
    - Software installers using PowerShell
level: high
fields:
    - CommandLine
    - Image
    - ParentImage
    - User

---

title: APT29 PowerShell Obfuscation ExecutionPolicy Bypass
id: a1b2c3d4-0002-4e5f-8a9b-apt29t1027
status: test
description: Detects PowerShell with ExecutionPolicy Bypass flag used by APT29 for defense evasion and encoded command execution.
references:
    - https://attack.mitre.org/techniques/T1027/
    - https://attack.mitre.org/groups/G0016/
    - https://uncoder.io/
author: TheCyberDefenseGuy
date: 2026-05-13
modified: 2026-05-13
tags:
    - attack.defense_evasion
    - attack.t1027
    - apt29
    - cozy_bear
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'bypass'
            - '-ep bypass'
            - '-ExecutionPolicy Bypass'
            - '-EncodedCommand'
            - ' -enc '
    condition: selection
falsepositives:
    - Some legitimate software deployment tools
    - Administrative scripts with explicit bypass
level: high
fields:
    - CommandLine
    - Image
    - ParentImage

